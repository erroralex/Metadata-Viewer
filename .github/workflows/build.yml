name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger only when a tag starting with 'v' is pushed (e.g., v1.1.0)

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_suffix: windows
          - os: ubuntu-latest
            asset_suffix: linux
          - os: macos-latest
            asset_suffix: macos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # javafx.platform is resolved automatically per-OS by the Maven profiles in
      # pom.xml, so each runner produces a jar bundling the correct native JavaFX
      # graphics library for its own platform.
      - name: Build (Maven)
        run: mvn --batch-mode clean package -DskipTests

      - name: Rename Artifact
        shell: bash
        run: |
          mkdir -p release
          jar_file=$(find target -maxdepth 1 -name 'MetadataViewer-*.jar' ! -name '*sources*' ! -name '*javadoc*')
          cp "$jar_file" "release/MetadataViewer-${{ matrix.asset_suffix }}.jar"

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.jar
